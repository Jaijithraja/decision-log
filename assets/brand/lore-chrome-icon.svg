<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ic-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76A2F8"/>
      <stop offset="100%" stop-color="#4F7DF2"/>
    </linearGradient>
    <linearGradient id="ic-lav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A59AF8"/>
      <stop offset="100%" stop-color="#7B8EF6"/>
    </linearGradient>
    <linearGradient id="ic-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5581F1"/>
      <stop offset="100%" stop-color="#3C66E2"/>
    </linearGradient>
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#436DE5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container tile -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#E2EBF8"/>

  <!-- Symbol -->
  <g transform="translate(32, 32) scale(0.48) translate(-60, -55)" filter="url(#icon-shadow)">
    <rect x="18" y="6" width="38" height="66" rx="14" fill="url(#ic-sky)"/>
    <rect x="34" y="22" width="40" height="60" rx="14" fill="url(#ic-lav)" opacity="0.88"/>
    <rect x="48" y="44" width="56" height="36" rx="14" fill="url(#ic-base)"/>
  </g>
</svg>
